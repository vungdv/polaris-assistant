# Helm values for Prometheus (K12, D8), installed by scripts/k8s/platform/platform-lgtm.sh from the upstream chart
# ($PROMETHEUS_CHART from $PROMETHEUS_REPO at $PROMETHEUS_VERSION, deploy/k8s/versions.env) into the `observability`
# namespace as the StatefulSet and Service `prometheus` (:9090), the name Grafana's datasource and Tempo's remote write
# use, as in Compose (docker-compose.otel.yml).
#
# Ported from docker/telemetry/prometheus/prometheus.yml and the Compose command line:
#   - the same scrape jobs, against the Services of this chart set (the Collector's Prometheus exporter and self-metrics,
#     Tempo, Loki, Grafana, Prometheus itself),
#   - the rule files are the Compose ones, docker/telemetry/prometheus/rules/*.yml (the same files `make test-rules`
#     checks): platform-lgtm.sh puts them in the ConfigMap `prometheus-rules` and the chart mounts it below,
#   - the remote-write receiver (Tempo's metrics generator writes span and service-graph metrics here), exemplar storage,
#     and retention of 15 days or 5GB, whichever is hit first.
# Alertmanager, Pushgateway and the chart's generic discovery jobs (pods, services, API server) are off. Cluster metrics
# for the Kubernetes dashboard (docker/telemetry/grafana/provisioning/dashboards/json/kubernetes-cluster.json) come from
# kube-state-metrics, the kubelets' cAdvisor and node-exporter (platform/node-exporter), which Compose has no equivalent
# of; they need the read-only ClusterRole enabled below. Pod Security `restricted`: the chart's pod context is non-root;
# the container context below drops every capability.

serviceAccounts:
  server:
    # Node discovery (the cAdvisor and node-exporter jobs below) reads the API with the pod's token.
    automountServiceAccountToken: true

# The chart's ClusterRole: read-only get/list/watch, which node and pod discovery and the kubelet's authorization of
# /metrics/cadvisor (nodes/metrics) need.
rbac:
  create: true

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
# Cluster object state (deployments, pods, nodes, PVCs) for the Kubernetes dashboard. The subchart's container meets Pod
# Security `restricted`; it's scraped by the `kube-state-metrics` job below.
kube-state-metrics:
  enabled: true
  fullnameOverride: kube-state-metrics
  # Scraped by the explicit job below, not by annotation discovery, which would also pick up CoreDNS.
  prometheusScrape: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

server:
  fullnameOverride: prometheus
  retention: 15d
  retentionSize: 5GB
  extraFlags:
    - web.enable-lifecycle
    # Tempo's metrics generator remote-writes here.
    - web.enable-remote-write-receiver
  extraArgs:
    enable-feature: exemplar-storage
  # Grafana's datasource and Tempo's remote write address the Service by :9090, as in Compose (the chart's default is 80).
  service:
    servicePort: 9090
  global:
    scrape_interval: 15s
    evaluation_interval: 30s
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  persistentVolume:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraConfigmapMounts:
    - name: rules
      mountPath: /etc/prometheus/rules
      configMap: prometheus-rules
      readOnly: true

# The chart's own config-reload sidecar is kept; it follows the same context.
configmapReload:
  prometheus:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

serverFiles:
  # Helm replaces lists: the chart's rule_files are replaced by the Compose rule directory.
  prometheus.yml:
    rule_files:
      - /etc/prometheus/rules/*.yml

scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  # Per-container CPU, memory, network and filesystem usage, scraped from each kubelet (TCP 10250).
  kubernetes-nodes-cadvisor:
    enabled: true
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

# docker/telemetry/prometheus/prometheus.yml, with the Services of this namespace. (`prometheus` itself is the chart's
# own job.)
extraScrapeConfigs: |
  # Application metrics re-exported by the Collector's prometheus exporter
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector.otel.svc.cluster.local:8889']
  # Collector self-metrics (accepted/refused/dropped, exporter queue and failures)
  - job_name: 'otel-collector-self'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector.otel.svc.cluster.local:8888']
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics:8080']
  # Host CPU, memory, disk and network: node-exporter runs in the `otel` namespace (platform/node-exporter), the node-level
  # telemetry namespace that already enforces Pod Security `privileged`, because it needs the host's namespaces and
  # `restricted` here forbids them. One pod per node, on the node's own IP.
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['otel']
        selectors:
          - role: pod
            label: 'app.kubernetes.io/name=prometheus-node-exporter'
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
