# NetworkPolicies of the `observability` namespace (K12, K11, TR-K10): default deny in both directions, DNS, and exactly
# the flows of the stack, each allowed on both of its ends (the Collector's side is in platform/otel, the Gateway's in
# base/network-policies/edge.yaml). Each policy selects the chart's pods by app.kubernetes.io/instance, the release name:
#   Collector -> Tempo 4317 (OTLP/gRPC)        Collector -> Loki 3100 (OTLP/HTTP)    Prometheus -> Collector 8888, 8889
#   Prometheus -> Tempo 3200, Loki 3100, Grafana 3000 (scrape)   Tempo -> Prometheus 9090 (remote write)
#   Prometheus -> kube-state-metrics 8080, the Kubernetes API 6443, kubelets 10250, node-exporter 9100 (cluster metrics)
#   Grafana -> Prometheus 9090, Loki 3100, Tempo 3200 (queries)  Gateway -> Grafana 3000  Grafana -> Gateway 443 (SSO:
#   https://id.polaris.local, through the CoreDNS rewrite). None of them reaches anything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: polaris
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS for every pod: cluster DNS (CoreDNS in kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
  labels:
    app.kubernetes.io/part-of: polaris
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
  labels:
    app.kubernetes.io/part-of: polaris
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: tempo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: prometheus
      ports:
        - protocol: TCP
          port: 3200
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: prometheus
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  labels:
    app.kubernetes.io/part-of: polaris
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: loki
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: otel-collector
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: prometheus
      ports:
        - protocol: TCP
          port: 3100
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: polaris
spec:
  # The server only: kube-state-metrics shares the release name and has its own policy below.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: tempo
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: otel-collector
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: tempo
      ports:
        - protocol: TCP
          port: 3200
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: grafana
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - protocol: TCP
          port: 8080
    # Node and pod discovery: the Kubernetes API (see base/network-policies/kustomization.yaml).
    - ports:
        - protocol: TCP
          port: 6443
    # The kubelets' cAdvisor (10250) and node-exporter (9100, on each node's own address: hostNetwork). Neither has a pod
    # to select.
    - ports:
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 9100
---
# kube-state-metrics: scraped by Prometheus, watches the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/part-of: polaris
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  labels:
    app.kubernetes.io/part-of: polaris
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: polaris
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: polaris
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: prometheus
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: tempo
      ports:
        - protocol: TCP
          port: 3200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: polaris
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: polaris
      ports:
        - protocol: TCP
          port: 443
