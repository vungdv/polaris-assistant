# Helm values for Loki (K12, D8), installed by scripts/k8s/platform/platform-lgtm.sh from the upstream chart
# ($LOKI_CHART from $GRAFANA_COMMUNITY_REPO at $LOKI_VERSION, deploy/k8s/versions.env) into the `observability` namespace as
# the StatefulSet and Service `loki` (:3100), the name the Collector's log exporter and Grafana's datasource use.
#
# Single binary on one volume (filesystem storage), as in Compose; the configuration is docker/telemetry/loki/loki.yml:
# the same schema, 7-day retention enforced by the compactor, ingest caps, and the cardinality guardrails (only
# service.name, service.namespace and deployment.environment are index labels; everything else is structured metadata).
# The chart's caches, gateway, canary, tests, self-monitoring and rules sidecar are off. Pod Security `restricted`: the
# chart's contexts are non-root, read-only root filesystem, no capabilities.

fullnameOverride: loki
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    retention_delete_delay: 2h
    compaction_interval: 10m
  limits_config:
    retention_period: 168h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    allow_structured_metadata: true
    volume_enabled: true
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - deployment.environment
    max_label_names_per_series: 8
    max_label_name_length: 64
    max_label_value_length: 256
    max_global_streams_per_user: 5000
    max_streams_per_user: 0
    max_structured_metadata_entries_count: 128
  # Anonymous usage statistics leave the cluster: off.
  analytics:
    reporting_enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
sidecar:
  rules:
    enabled: false

# The other deployment modes' components stay at zero replicas.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
