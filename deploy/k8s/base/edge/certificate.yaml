# One edge certificate for the three public hosts (TR-K7), signed by the cluster root CA (platform/pki).
# The Gateway's HTTPS listeners terminate TLS with the Secret cert-manager keeps renewed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: polaris-edge-tls
  namespace: polaris
spec:
  secretName: polaris-edge-tls
  dnsNames:
    - polaris.local
    - id.polaris.local
    - grafana.polaris.local
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: polaris-ca
