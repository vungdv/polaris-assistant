# Gateway tracing (K4, TR-K9): NGINX Gateway Fabric traces the requests of each HTTPRoute listed here and exports the
# spans to the Collector configured in platform/nginx-gateway-fabric (NginxProxy telemetry). As in Compose:
#   - every request is sampled at the edge (ratio 100); the apps honour the parent's sampled flag,
#   - `propagate` continues an incoming W3C traceparent (or starts a trace) and injects it towards the upstream.
# A route without a policy isn't traced. Each slice that adds an HTTPRoute (K7-K12) adds it to targetRefs (max 16).
apiVersion: gateway.nginx.org/v1alpha2
kind: ObservabilityPolicy
metadata:
  name: edge-tracing
  namespace: polaris
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: http-redirect
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: keycloak
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: polaris
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: polaris-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: polaris-assistant
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: polaris-assistant-api-docs
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: swagger-ui
  tracing:
    strategy: ratio
    ratio: 100
    context: propagate
