# HTTP -> HTTPS for every public host: a permanent redirect to the same host and path on the HTTPS port.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: polaris
spec:
  parentRefs:
    - name: polaris
      sectionName: http
  hostnames:
    - polaris.local
    - id.polaris.local
    - grafana.polaris.local
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
