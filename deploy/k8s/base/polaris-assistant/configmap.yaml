# Non-secret settings of the assistant (K9, TR-K3), mapped from Compose's `polaris-assistant` service environment.
# Differences from Compose:
#   - Addresses are the cluster's Services: the CNPG primary `polaris-db-rw` (the assistant shares the polaris database,
#     as on Compose), `redis`, the `polaris` Service for MCP and the Order Management REST API, and the Collector. The
#     issuer stays the public `https://id.polaris.local` (TR-K8), which CoreDNS rewrites to the Gateway.
#   - The datasource credentials come from the CNPG Secret `polaris-db-app`, and GEMINI_API_KEY, TYPESAFE_API_KEY and the
#     AGENTO11Y_* settings from the Secret `polaris-assistant` (deployment.yaml), not from here.
#   - The trust store is the trust-manager bundle mounted at /etc/polaris-trust (deployment.yaml), with Compose's
#     `-Djavax.net.ssl.trustStore` system property. The JVM sizes its heap from the container memory limit.
#   - application.yml defaults `spring.jpa.show-sql` to true (dev-only SQL logging), so it is turned off here, as for
#     polaris (K8). springdoc's OAuth settings use the canonical underscore names that application.yml reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-assistant
  labels:
    app.kubernetes.io/name: polaris-assistant
    app.kubernetes.io/part-of: polaris
data:
  SERVER_PORT: "8081"
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://id.polaris.local/realms/polaris
  SPRING_DATASOURCE_URL: jdbc:postgresql://polaris-db-rw:5432/polaris
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_SHOW_SQL: "false"
  # MCP and the Order Management REST API on the polaris Service (K8).
  POLARIS_MCP_CORE_URL: http://polaris:8080/mcp
  POLARIS_MCP_CORE_MESSAGE_ENDPOINT: http://polaris:8080/mcp
  POLARIS_CORE_API_BASE_URL: http://polaris:8080
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRINGDOC_SWAGGER_UI_OAUTH_CLIENT_ID: polaris-app
  SPRINGDOC_SWAGGER_UI_OAUTH_USE_PKCE_WITH_AUTHORIZATION_CODE_GRANT: "true"
  JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/etc/polaris-trust/truststore.jks -XX:MaxRAMPercentage=70
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/logs
  # Every request is sampled at the Gateway; the assistant honours the parent's flag (and samples its own roots).
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
