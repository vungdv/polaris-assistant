# Assistant (K9): the `polaris-assistant` Deployment (2 replicas), its Service, ConfigMap, PodDisruptionBudget and
# HTTPRoutes. Needs what earlier slices deploy: the CNPG Secret polaris-db-app and Redis (K5), Keycloak behind
# id.polaris.local (K7), polaris (K8), the trust bundle polaris-ca-bundle and the Gateway (K3), and the Collector (K4).
# Its Secret `polaris-assistant` (GEMINI_API_KEY, TYPESAFE_API_KEY, AGENTO11Y_*) is generated by scripts/k8s/up.sh from
# the untracked env file, so no credential is committed (TR-K3). The image is named `polaris-assistant`; overlays pin it
# to ghcr.io/<owner>/polaris-assistant:<git-sha> (K2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: polaris
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - httproute.yaml
