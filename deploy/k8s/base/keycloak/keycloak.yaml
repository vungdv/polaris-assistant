# Keycloak (K7, D4, TR-K8): Compose's `keycloak` service, run by the Keycloak Operator (platform/keycloak-operator) in
# production mode (`start`, not `start-dev`) on the CNPG Cluster keycloak-db. The operator creates the StatefulSet
# `keycloak`, the Service `keycloak-service` (8080 HTTP, 9000 management) and the bootstrap admin's Secret
# `keycloak-initial-admin` (generated, never committed).
#
# Realms. polaris-realm.json is a KeycloakRealmImport (generated by scripts/k8s/lib.sh, write_realm_imports). The
# master realm can't be one: the operator runs an import Job only once the server is ready, by which time the server
# has created its built-in master realm, and the Job imports with --override=false, so master-realm.json would be
# skipped. Instead the server imports it itself at its first start, exactly as Compose does (`--import-realm` with the
# file in /opt/keycloak/data/import): into an empty database, master-realm.json replaces the built-in master
# (Grafana's SSO client, its roles and `grafana-admin`); on later starts the existing realm is kept. Its
# ${DEFAULT_PASSWORD} comes from the same Secret as the KeycloakRealmImport placeholders.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: polaris
spec:
  # One instance, as in Compose.
  instances: 1
  # Keycloak 26.2.5 (what Compose's quay.io/keycloak/keycloak:26.2 resolves to), pinned by digest. The stock image
  # isn't pre-built for PostgreSQL, so it starts unoptimized (Keycloak builds at startup).
  image: quay.io/keycloak/keycloak:26.2.5@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
  startOptimized: false
  db:
    vendor: postgres
    host: keycloak-db-rw
    port: 5432
    database: keycloak
    # Operator-generated CNPG credentials (TR-K3 exception).
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  # The Gateway terminates TLS (TR-K7) and forwards plain HTTP with X-Forwarded-* headers, as Compose's nginx does.
  http:
    httpEnabled: true
    httpPort: 8080
  proxy:
    headers: xforwarded
  # One public issuer, https://id.polaris.local/realms/<realm>, for browsers and pods alike (TR-K8, D7).
  hostname:
    hostname: https://id.polaris.local
  # Routing is the Gateway's HTTPRoute (httproute.yaml), not an Ingress. NetworkPolicies come with K11's allow list.
  ingress:
    enabled: false
  networkPolicy:
    enabled: false
  # Traces to the in-cluster Collector (TR-K9), with Compose's sampler.
  tracing:
    enabled: true
    endpoint: http://otel-collector.polaris.svc.cluster.local:4317
    protocol: grpc
    serviceName: keycloak
    samplerType: traceidratio
    samplerRatio: 1.0
  # Health (the operator's probes) and Prometheus metrics on the management port 9000, which no route exposes.
  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: metrics-enabled
      value: "true"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1536Mi
  unsupported:
    podTemplate:
      spec:
        # Pod Security `restricted` (TR-K10). The image runs as the numeric UID 1000. The root filesystem stays
        # writable: an unoptimized start runs `kc.sh build`, which rewrites /opt/keycloak/lib. The operator's import
        # Job copies this pod template, so it passes `restricted` too.
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: keycloak
            args: ["--verbose", "start", "--import-realm"]
            # The realm placeholders as env vars, for the server's import of master-realm.json (${DEFAULT_PASSWORD}).
            # envFrom, not env: the operator's import Job copies this container and adds the KeycloakRealmImport's
            # spec.placeholders to its env, which an env entry of the same name would duplicate (rejected).
            envFrom:
              - secretRef:
                  name: keycloak-realm-placeholders
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            volumeMounts:
              - name: master-realm
                mountPath: /opt/keycloak/data/import
                readOnly: true
        volumes:
          - name: master-realm
            configMap:
              name: keycloak-master-realm
