# https://id.polaris.local -> Keycloak (K7, TR-K7), as Compose's nginx `id.polaris.local` server: every path to the
# HTTP port, with the X-Forwarded-* headers NGINX Gateway Fabric sets. Compose doesn't block /admin or tune buffers for
# Keycloak, so neither does this route. The management port (health, metrics) stays in-cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: polaris
spec:
  parentRefs:
    - name: polaris
      sectionName: https-id
  hostnames:
    - id.polaris.local
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
