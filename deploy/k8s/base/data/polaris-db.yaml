# PostgreSQL for the core context (K5, D2, TR-K6): Compose's `polaris-db` (postgres:16, database and owner `polaris`).
# `polaris` and `polaris-assistant` share this database and its owner role, as in Compose; the apps connect to it in
# K8 and K9. CloudNativePG generates the owner's credentials as the Secret `polaris-db-app` (keys username, password,
# host, port, dbname, uri, jdbc-uri) and serves the primary on the Service `polaris-db-rw`. Superuser access over the
# network stays off (CNPG default).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: polaris-db
  labels:
    app.kubernetes.io/name: polaris-db
    app.kubernetes.io/part-of: polaris
spec:
  # Three instances (primary plus two streaming replicas) for failover; overlays/local runs one.
  instances: 3
  # PostgreSQL 16.15, the release Compose's postgres:16 resolves to, on the same Debian base (trixie). The `standard`
  # flavour carries all locales, so initdb can use Compose's en_US.utf8.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-standard-trixie@sha256:34c186731c221d8a788ac3758240653743a4f6237c52a6a2d6de29c6e1d1b834
  bootstrap:
    initdb:
      database: polaris
      owner: polaris
      # Compose's postgres image runs initdb with LANG=en_US.utf8; CNPG defaults to the C locale. Matching it keeps
      # text ordering and comparison the same as Compose (dev-prod parity).
      encoding: UTF8
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
  # A smart shutdown waits for every client to disconnect, and the apps' connection pools (K8, K9) never do, so a
  # restarted instance would hang for the 180s default before CNPG's fast shutdown. 15s lets in-flight transactions
  # finish; the apps reconnect to the new primary through polaris-db-rw.
  smartShutdownTimeout: 15
  # The volume comes from the cluster's default StorageClass.
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
