# https://polaris.local -> polaris (K8, TR-K7), as Compose's nginx `polaris.local` server:
#   - `polaris`      every path (`location /`): the catalogue and order APIs, springdoc's /v3/api-docs, actuator,
#   - `polaris-mcp`  /mcp/ (`location /mcp/`): MCP over SSE, unbuffered with a long read timeout (proxy-settings below).
# The more specific prefix wins (Gateway API precedence), and /swagger-ui goes to Swagger UI (base/swagger-ui).
# NGINX Gateway Fabric sets Host and the X-Forwarded-For/-Proto/-Host/-Port headers that nginx set explicitly on
# Compose, and proxies over HTTP/1.1 with keep-alive. Both routes are traced (base/edge/tracing-policy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: polaris
  labels:
    app.kubernetes.io/name: polaris
    app.kubernetes.io/part-of: polaris
spec:
  parentRefs:
    - name: polaris
      sectionName: https-polaris
  hostnames:
    - polaris.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: polaris
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: polaris-mcp
  labels:
    app.kubernetes.io/name: polaris
    app.kubernetes.io/part-of: polaris
spec:
  parentRefs:
    - name: polaris
      sectionName: https-polaris
  hostnames:
    - polaris.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/
      backendRefs:
        - name: polaris
          port: 8080
---
# SSE on /mcp/ (TR-K7): Compose's `proxy_buffering off` (events reach the client as they are written) and a read
# timeout long enough for an idle stream, instead of nginx's 60s default.
apiVersion: gateway.nginx.org/v1alpha1
kind: ProxySettingsPolicy
metadata:
  name: polaris-mcp-sse
  labels:
    app.kubernetes.io/name: polaris
    app.kubernetes.io/part-of: polaris
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: polaris-mcp
  buffering:
    disable: true
  timeout:
    read: 1h
    send: 1h
