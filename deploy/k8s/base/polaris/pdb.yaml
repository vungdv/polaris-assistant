# Voluntary disruptions (node drains) evict at most one of the two replicas at a time (TR-K5).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: polaris
  labels:
    app.kubernetes.io/name: polaris
    app.kubernetes.io/part-of: polaris
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polaris
