# https://grafana.polaris.local -> Grafana (K12, TR-K7), as Compose's nginx `grafana.polaris.local` server. Grafana is
# installed from its upstream chart (platform/grafana) as the Service `grafana` in the `observability` namespace. The
# Gateway listener `https-grafana` accepts routes from this namespace only (allowedRoutes: Same), so the route is here
# and the ReferenceGrant in platform/observability lets it reach that Service. Traced like every route
# (base/edge/tracing-policy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: polaris
spec:
  parentRefs:
    - name: polaris
      sectionName: https-grafana
  hostnames:
    - grafana.polaris.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          namespace: observability
          port: 3000
