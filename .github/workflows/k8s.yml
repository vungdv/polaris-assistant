# Kubernetes deployment (deploy/k8s, ADR-0021): validate the rendered manifests, then bring the stack up on a
# kind cluster and run the smoke test. Tool versions come from deploy/k8s/versions.env via scripts/k8s/tools.sh.

name: Kubernetes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Lint scripts
      run: shellcheck -x scripts/k8s/*.sh
    - name: Validate rendered manifests (kustomize + kubeconform) and Helm values
      run: make k8s-validate

  kind:
    name: Deploy to kind and smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    # The untracked env file the cluster's Secrets come from (TR-K3), with the assistant's model API keys (K9) from the
    # repository secrets. The values reach the file through environment variables, never the command line; the file is
    # git-ignored and lives only on the runner.
    - name: Write deploy/k8s/.env.local from repository secrets
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      run: |
        umask 077
        printf 'GEMINI_API_KEY=%s\nTYPESAFE_API_KEY=%s\n' "$GEMINI_API_KEY" "$TYPESAFE_API_KEY" > deploy/k8s/.env.local
    - name: Create cluster and apply overlays/local
      run: make k8s-up
    # The three apps (K8: polaris, K9: polaris-assistant, K10: polaris-fulfilment-emulator), built from this commit and
    # loaded with `kind load` (GHCR packages are private, and PR images aren't pushed). Both polaris replicas then start
    # together on the empty database, the concurrent Flyway start the smoke test checks; the assistant and the emulator
    # start once polaris is ready.
    - name: Build and load the app images
      run: make k8s-images APPS="polaris polaris-assistant polaris-fulfilment-emulator"
    - name: Re-run k8s-up (idempotent; waits for the apps)
      run: make k8s-up
    - name: Smoke test
      run: make k8s-smoke
    - name: Dump cluster state
      if: failure()
      run: |
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris get all,events -A || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris get clusterissuers,certificates,bundles,gateways,httproutes -A -o wide || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris describe gateways,certificates -A || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris get nginxproxies,observabilitypolicies -A -o yaml || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs deployment/otel-collector --tail=300 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n observability logs daemonset/otel-agent --tail=100 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris get clusters.postgresql.cnpg.io,pvc -o wide || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris describe clusters.postgresql.cnpg.io || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n cnpg-system logs deployment/cloudnative-pg --tail=200 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris get kafkas.kafka.strimzi.io,kafkanodepools.kafka.strimzi.io,pods -l strimzi.io/cluster=kafka -o wide || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris describe kafkas.kafka.strimzi.io,kafkanodepools.kafka.strimzi.io || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n strimzi logs deployment/strimzi-cluster-operator --tail=200 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris get keycloaks.k8s.keycloak.org,keycloakrealmimports.k8s.keycloak.org,statefulsets,jobs -o wide || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris describe keycloaks.k8s.keycloak.org,keycloakrealmimports.k8s.keycloak.org || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs deployment/keycloak-operator --tail=200 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs statefulset/keycloak --tail=200 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris describe deployments/polaris deployments/swagger-ui httproutes proxysettingspolicies || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs -l app.kubernetes.io/name=polaris --prefix --tail=300 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs deployment/swagger-ui --all-containers --tail=100 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris describe deployments/polaris-assistant || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs -l app.kubernetes.io/name=polaris-assistant --all-containers --prefix --tail=300 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris describe deployments/polaris-fulfilment-emulator || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs -l app.kubernetes.io/name=polaris-fulfilment-emulator --all-containers --prefix --tail=300 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris get nodes -o wide || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris get networkpolicies,hpa,pods -o wide || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris get objectstores.barmancloud.cnpg.io,scheduledbackups.postgresql.cnpg.io,backups.postgresql.cnpg.io -o wide || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris describe hpa || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n cnpg-system logs deployment/barman-cloud --tail=200 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n polaris logs -l cnpg.io/cluster=polaris-db -c plugin-barman-cloud --prefix --tail=200 || true
        .tools/bin/kubectl --kubeconfig .tools/kubeconfig --context kind-polaris -n object-store logs deployment/seaweedfs-all-in-one --tail=100 || true
        .tools/bin/kind export logs --name polaris "${RUNNER_TEMP}/kind-logs" || true
    - name: Upload kind logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: kind-logs
        path: ${{ runner.temp }}/kind-logs
        if-no-files-found: ignore
        retention-days: 7
    - name: Delete cluster
      if: always()
      run: make k8s-down
