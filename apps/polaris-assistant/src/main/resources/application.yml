server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: Polaris-Assistant
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/polaris_assistant;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://id.polaris.local/realms/polaris}

polaris:
  ai:
    provider: gemini
    api-key: ${GEMINI_API_KEY:${POLARIS_AI_API_KEY:}}
    model: ${POLARIS_AI_MODEL:gemini-3.6-flash}
    base-url: ${POLARIS_AI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${POLARIS_AI_TIMEOUT_SECONDS:30}
    # Budget for a whole chat turn, below the 30 s chat latency SLO; exhausted -> 503
    turn-deadline: ${POLARIS_AI_TURN_DEADLINE:25s}
    # Grafana AI Observability (agento11y SDK): OTel GenAI semconv spans + gen_ai.client.* metrics.
    telemetry:
      agent-version: ${AGENTO11Y_AGENT_VERSION:}
      content-capture: ${AGENTO11Y_CONTENT_CAPTURE_MODE:metadata_only}
      # none = no generation export (local). http/grpc + AGENTO11Y_ENDPOINT/AGENTO11Y_AUTH_* = Grafana Cloud Conversations.
      generation-export-protocol: ${AGENTO11Y_PROTOCOL:none}
      metrics-endpoint: ${management.otlp.metrics.export.url}
  typesafe:
    api-key: ${TYPESAFE_API_KEY:${POLARIS_TYPESAFE_API_KEY:}}
    model: ${POLARIS_TYPESAFE_MODEL:jev-latest}
    base-url: ${POLARIS_TYPESAFE_BASE_URL:https://api.typesafe.ai}
    timeout-seconds: ${POLARIS_TYPESAFE_TIMEOUT_SECONDS:3}
  core:
    api:
      # Order Management REST contract, used to resolve the caller's own customer (GET /api/v1/customers/me)
      base-url: ${POLARIS_CORE_API_BASE_URL:http://localhost:8080}
  mcp:
    core:
      url: ${POLARIS_CORE_MCP_URL:http://localhost:8080/mcp}
      message-endpoint: ${POLARIS_CORE_MCP_MESSAGE_ENDPOINT:http://localhost:8080/mcp}
  assistant:
    intent:
      file: ${POLARIS_ASSISTANT_INTENT_FILE:classpath:intents.json}
      redis:
        key: ${POLARIS_ASSISTANT_INTENT_REDIS_KEY:polaris:assistant:intents}
        local-cache-ttl: ${POLARIS_ASSISTANT_INTENT_REDIS_LOCAL_CACHE_TTL:30s}
        fallback-retry-interval: ${POLARIS_ASSISTANT_INTENT_REDIS_FALLBACK_RETRY_INTERVAL:5s}
        seed-if-missing: ${POLARIS_ASSISTANT_INTENT_REDIS_SEED_IF_MISSING:true}

# Circuit breaker per AI model provider; retry for Gemini only (it runs inside the breaker)
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${POLARIS_AI_BREAKER_WINDOW_SIZE:20}
        minimum-number-of-calls: ${POLARIS_AI_BREAKER_MINIMUM_CALLS:10}
        failure-rate-threshold: ${POLARIS_AI_BREAKER_FAILURE_RATE:50}
        wait-duration-in-open-state: ${POLARIS_AI_BREAKER_OPEN_DURATION:30s}
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      gemini:
        base-config: default
      typeSafe:
        base-config: default
        # TypeSafe is called on every turn, so judge it over recent time rather than a call count
        sliding-window-type: TIME_BASED
        sliding-window-size: ${POLARIS_AI_TYPESAFE_BREAKER_WINDOW_SECONDS:60}
  retry:
    configs:
      gemini:
        max-attempts: ${POLARIS_AI_RETRY_MAX_ATTEMPTS:2}
        wait-duration: ${POLARIS_AI_RETRY_WAIT:500ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: polaris-app
      use-pkce-with-authorization-code-grant: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness: db, polarisMcp (required for every endpoint).
      # Not in readiness, shown on /actuator/health only:
      #   gemini   - required for chat; an outage returns 503 Problem Details
      #   typeSafe - optional; an outage degrades intent classification to general.conversation
      #   circuitBreakers - state of the gemini and typeSafe breakers (an open breaker doesn't change the aggregate)
      group:
        readiness:
          include: readinessState,db,polarisMcp
      # Component statuses for authenticated callers; anonymous callers see the aggregate only.
      show-components: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info # ,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  # Explicit histogram buckets (none by default, so no percentile was computable).
  # They include the SLO thresholds in docker/telemetry/prometheus/rules/assistant-slo.rules.yml (2s, 30s).
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s,10s,20s,30s,60s
        # staging -> decision; the price hold (draft TTL) is 15 min
        polaris.assistant.draft.lifetime: 15s,30s,1m,2m,5m,10m,15m,30m
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/logs}
