server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: Polaris-Fulfilment-Emulator
  threads:
    virtual:
      enabled: true
  kafka:
    # Host default for `make run` (the cluster's HOST listeners); compose sets the internal kafka-N:9092 list.
    bootstrap-servers: localhost:9094,localhost:9095,localhost:9096
    admin:
      operation-timeout: 10s
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # Explicit per group (ADR-0019 §4.1.5): a new partner group replays the topic (F2 design §6).
      auto-offset-reset: earliest
      enable-auto-commit: false

polaris:
  fulfilment:
    partners: partner-north,partner-central,partner-south
    claim-pause:
      min: ${POLARIS_FULFILMENT_CLAIM_PAUSE_MIN:1s}
      max: ${POLARIS_FULFILMENT_CLAIM_PAUSE_MAX:5s}
    step-delay: ${POLARIS_FULFILMENT_STEP_DELAY:2s}
    order-api:
      base-url: ${POLARIS_CORE_API_BASE_URL:http://localhost:8080}
    auth:
      token-uri: ${POLARIS_FULFILMENT_TOKEN_URI:https://id.polaris.local/realms/polaris/protocol/openid-connect/token}
      client-id: polaris-fulfilment-emulator
      # Environment only, no default (TR-X1); the same variable seeds the Keycloak realm import.
      client-secret: ${POLARIS_FULFILMENT_EMULATOR_SECRET:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/logs}
