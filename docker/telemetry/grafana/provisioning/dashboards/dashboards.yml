apiVersion: 1

# Dashboards are provisioned from JSON in this repo and are read-only in the UI: change the JSON, not the dashboard.
providers:
  - name: polaris
    folder: Polaris
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
