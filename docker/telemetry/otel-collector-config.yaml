# https://opentelemetry.io/docs/collector/configuration/
# Pipeline hardening:
#   - memory_limiter is FIRST in every pipeline
#   - every exporter has a bounded sending_queue and retry_on_failure; when a backend is
#     down the queue fills, then data is dropped (never back-pressures the apps for long)
#   - collector self-metrics on :8888 are scraped by Prometheus
#   - health_check on :13133 drives the compose healthcheck
# Redaction and cardinality guardrails:
#   - redaction/secrets + transform/redact_* run on ALL pipelines (incl. the edge access log)
#     after memory_limiter and BEFORE batch/exporter: secrets and PII never reach a backend
#   - transform/metric_allowlist keeps only allow-listed attribute keys on metric data points
#     (user_id, order_*, ... are dropped from metrics; traces and logs keep them)
# Grafana Cloud (https://sincerelorry365.grafana.net/):
#   - every pipeline also fans out to the stack's OTLP gateway via otlp_http/grafana_cloud,
#     after the same redaction/allow-list processors as the local backends
#   - endpoint and credentials come from the environment (GRAFANA_CLOUD_OTLP_ENDPOINT,
#     GRAFANA_CLOUD_INSTANCE_ID, GRAFANA_CLOUD_API_TOKEN), never from this file

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  # Grafana Cloud OTLP gateway auth: username = stack instance ID, password = Access Policy
  # token with metrics:write, logs:write and traces:write scopes.
  basicauth/grafana_cloud:
    client_auth:
      username: "${env:GRAFANA_CLOUD_INSTANCE_ID}"
      password: "${env:GRAFANA_CLOUD_API_TOKEN}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  # Gateway access log: nginx sends JSON access-log lines over syslog/UDP.
  syslog:
    udp:
      listen_address: "0.0.0.0:5514"
    protocol: rfc3164
    location: UTC
  # Gateway connection metrics from the internal-only stub_status listener.
  nginx:
    endpoint: "http://nginx:8088/stub_status"
    collection_interval: 10s

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 30
    spike_limit_percentage: 6
  resource/nginx:
    attributes:
      - {key: service.name, value: nginx-gateway, action: upsert}
  # ngx_otel_module always records http.target WITH the raw query string (OAuth code/state) and
  # otel_span_attr cannot replace it (it appends a duplicate). Remove every copy on gateway
  # spans; the query-free path is carried by url.path (set in nginx.conf).
  transform/nginx_spans:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["service.name"] == "nginx-gateway"
        statements:
          - delete_matching_keys(span.attributes, "^http\\.target$")
          - delete_matching_keys(span.attributes, "^url\\.query$")
  # Parse the JSON access log: promote trace_id/span_id to the log record (Loki structured
  # metadata, same correlation as app logs), keep the JSON as body, map 5xx to ERROR.
  transform/nginx_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.cache, ParseJSON(log.attributes["message"]))
          - set(log.body, log.attributes["message"])
          - set(log.trace_id.string, log.cache["trace_id"]) where IsString(log.cache["trace_id"]) and log.cache["trace_id"] != ""
          - set(log.span_id.string, log.cache["span_id"]) where IsString(log.cache["span_id"]) and log.cache["span_id"] != ""
          - set(log.attributes["http.route"], log.cache["route"])
          - set(log.attributes["http.response.status_code"], log.cache["status"])
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.cache["status"] >= 500
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.cache["status"] < 500
          - delete_key(log.attributes, "message")
  # ---- Redaction. Regexes are RE2; single-quoted YAML keeps backslashes literal. ----
  # Attribute KEYS that carry credentials have their value masked; attribute VALUES (any key,
  # on spans, span events, log records and metric data points) matching a PII/secret shape are
  # masked. allow_all_keys keeps all other attributes (no allow-list on traces/logs).
  redaction/secrets:
    allow_all_keys: true
    summary: silent
    blocked_key_patterns:
      - '(?i).*(authorization|cookie|passw(or)?d|passwd|secret|api[-_.]?key|credential|access[-_.]?token|refresh[-_.]?token|id[-_.]?token|session[-_.]?id).*'
      - '(?i)(^|.*[._-])token$'
    blocked_values:
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'            # email
      - '\b(?:\d{4}[ -]){3}\d{1,4}\b'                                # card, grouped
      - '\b[3-6]\d{12,15}\b'                                          # card, contiguous 13-16 digits
      - '(?i)\b(bearer|basic)\s+[A-Za-z0-9._~+/=-]{8,}'               # Authorization header values
      - 'eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]*'      # JWT
  # Free text the redaction processor does not see as attribute values: log bodies (incl. the
  # edge JSON access line), span names and status messages. Same shapes as above.
  transform/redact_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'replace_pattern(log.body, "(?i)\"?(authorization|proxy-authorization|cookie|set-cookie|password|secret|api[-_]?key|access_token|refresh_token|id_token|token)\"?\\s*[:=]\\s*\"?[^\",;&\\s}]+(\\s+[A-Za-z0-9._~+/=-]{8,})?", "$$1=***") where IsString(log.body)'
          - 'replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***") where IsString(log.body)'
          - 'replace_pattern(log.body, "\\b(?:\\d{4}[ -]){3}\\d{1,4}\\b", "***") where IsString(log.body)'
          - 'replace_pattern(log.body, "\\b[3-6]\\d{12,15}\\b", "***") where IsString(log.body)'
          - 'replace_pattern(log.body, "(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "***") where IsString(log.body)'
          - 'replace_pattern(log.body, "eyJ[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]*", "***") where IsString(log.body)'
  transform/redact_traces:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'replace_pattern(span.name, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***")'
          - 'replace_pattern(span.status.message, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***")'
          - 'replace_pattern(span.status.message, "(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "***")'
  # Cardinality guardrail: metric data points keep ONLY these attribute key families
  # (semantic-convention and Micrometer/JVM/Spring/Kafka/DB keys, all bounded). Anything else
  # (user_id, order_*, session/request ids, ...) is dropped from metrics. To allow a new metric
  # attribute, add its key family here after checking it is bounded.
  # Async metrics: event (event_type: CloudEvents type), group (Kafka consumer group), destination (outbox
  # logical destination), all small fixed sets.
  # GenAI metrics (gen_ai.client.*, Grafana AI Observability): gen_ai.provider.name, gen_ai.request.model,
  # gen_ai.agent.name/version, gen_ai.operation.name, gen_ai.token.type, gen_ai.tool.name, plus error.type /
  # error.category; all bounded by configuration (models, agents, tools). Conversation/session ids never reach metrics.
  # Assistant outcome metrics (polaris.assistant.*): intent (ids of the configured intents only, else "unknown"),
  # plus outcome / cause, all small fixed sets.
  transform/metric_allowlist:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          # Credential-looking keys: token only as a suffix (auth.token, access_token), so gen_ai.token.type survives.
          - 'delete_matching_keys(datapoint.attributes, "(?i)(authorization|cookie|passw|secret|token$|credential|api[-_.]?key|\\.header\\.)")'
          - 'keep_matching_keys(datapoint.attributes, "^(http|url|server|error|exception|jvm|db|messaging|system|process|kafka|spring|authentication|net|network|rpc|state|area|id|pool|name|gc|cause|action|outcome|status|method|uri|result|level|topic|partition|client|node|type|path|version|vendor|runtime|compiler|main|listener|cache|scope|service|deployment|host|le|quantile|event|group|destination|gen_ai|intent)([._].*)?$")'
  batch:
    timeout: 2s
    send_batch_max_size: 8192

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000        # batches; bounded, new data is refused (dropped) when full
  prometheus:
    endpoint: "0.0.0.0:8889"  # prometheus scrapes this; pull-based, no queue applies
  otlp_http/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
  # Grafana Cloud OTLP gateway, e.g. https://otlp-gateway-prod-<zone>.grafana.net/otlp
  # (the exporter appends /v1/traces, /v1/metrics, /v1/logs).
  otlp_http/grafana_cloud:
    endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
    auth:
      authenticator: basicauth/grafana_cloud
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

service:
  extensions: [health_check, basicauth/grafana_cloud]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/nginx_spans, redaction/secrets, transform/redact_traces, batch]
      exporters: [otlp_grpc/tempo, otlp_http/grafana_cloud]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets, transform/metric_allowlist, batch]
      exporters: [prometheus, otlp_http/grafana_cloud]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/secrets, transform/redact_logs, batch]
      exporters: [otlp_http/logs, otlp_http/grafana_cloud]
    logs/nginx:
      receivers: [syslog]
      processors: [memory_limiter, resource/nginx, transform/nginx_logs, redaction/secrets, transform/redact_logs, batch]
      exporters: [otlp_http/logs, otlp_http/grafana_cloud]
    metrics/nginx:
      receivers: [nginx]
      processors: [memory_limiter, resource/nginx, redaction/secrets, transform/metric_allowlist, batch]
      exporters: [prometheus, otlp_http/grafana_cloud]
