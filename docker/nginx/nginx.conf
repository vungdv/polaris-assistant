# Gateway telemetry: OTLP traces to the Collector, JSON access log over syslog, stub_status for health.
load_module modules/ngx_otel_module.so;

worker_processes auto;
error_log /dev/stderr notice;

events {}

http {
  # ---- Telemetry -----------------------------------------------------------------------
  # Traces: OTLP/gRPC to the Collector. Export is asynchronous and batched; if the Collector
  # is down, spans are dropped and request handling is unaffected.
  otel_exporter {
    endpoint otel-collector:4317;
    interval 5s;
    batch_size 512;
    batch_count 4;
  }
  otel_service_name nginx-gateway;
  # Sampling is decided here once (100% in dev); Polaris services honour the parent's flag.
  split_clients "$request_id" $otel_sample {
    100%  on;
    *     off;
  }
  otel_trace $otel_sample;
  # Continue an incoming traceparent, otherwise start a trace; inject it towards upstreams.
  otel_trace_context propagate;

  # Route name: low-cardinality label used as span name, http.route and log field.
  # Each server sets a default $route; each location sets its own (and $sse=true for
  # long-lived streams so latency SLIs can exclude them).
  otel_span_name "$route";
  otel_span_attr http.route "$route";
  otel_span_attr polaris.sse "$sse";
  # Module defaults use pre-1.21 semconv names and record http.target WITH the query string;
  # otel_span_attr only appends, so the Collector (transform/nginx_spans) deletes http.target.
  # Add current semconv names and the query-free path.
  otel_span_attr http.request.method "$request_method";
  otel_span_attr http.response.status_code "$status";
  otel_span_attr url.path "$uri";

  # A dead upstream (stopped container, no RST) must surface as a 502/504 within seconds,
  # not after the 60s default, so edge failures are visible in logs and span metrics.
  proxy_connect_timeout 3s;

  # Logs: JSON, never the query string, Authorization, cookies, OAuth code/state (no $args,
  # $request, $request_uri or $http_* variables are logged).
  log_format edge_json escape=json
    '{"time":"$time_iso8601","trace_id":"$otel_trace_id","span_id":"$otel_span_id",'
    '"host":"$host","route":"$route","sse":"$sse","uri":"$uri","method":"$request_method",'
    '"status":$status,"upstream_status":"$upstream_status",'
    '"request_time":"$request_time","upstream_response_time":"$upstream_response_time",'
    '"bytes_sent":$body_bytes_sent}';
  # syslog over UDP is fire-and-forget: it never blocks a worker; loss is acceptable.
  access_log syslog:server=otel-collector:5514,facility=local7,tag=nginx,severity=info edge_json;
  access_log /dev/stdout edge_json;

  # Internal-only listener (not published by compose): healthcheck + Collector scrape.
  server {
    listen 8088;
    access_log off;
    otel_trace off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    location = /stub_status {
      stub_status;
    }
  }

  # Redirect all HTTP to HTTPS
  server {
    listen 80;
    server_name polaris.local id.polaris.local grafana.polaris.local;
    set $route "http-redirect";
    set $sse "false";
    return 301 https://$host$request_uri;
  }

  # Core App & Application Sub-path Ingress
  server {
    listen 443 ssl;
    server_name polaris.local;
    set $route "polaris:/";
    set $sse "false";

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      set $route "polaris:/";
      proxy_pass http://polaris:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }

    # MCP SSE Endpoint Buffer Disabling
    location /mcp/ {
      set $route "polaris:/mcp/";
      set $sse "true";

      proxy_pass http://polaris:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
    }

    # Standalone Swagger UI Portal
    location /swagger-ui {
      set $route "swagger-ui";

      proxy_pass http://swagger-ui:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }

    location = /swagger-ui.html {
      set $route "swagger-ui.html";

      return 301 https://$host/swagger-ui/index.html;
    }

    # AI Assistant OpenAPI Specification (Routed to standard /v3/api-docs on assistant service)
    location /v3/api-docs/assistant {
      set $route "assistant:/v3/api-docs";

      proxy_pass http://polaris-assistant:8081/v3/api-docs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }

    # AI Assistant Application (Sub-path routing)
    location /api/v1/assistant {
      set $route "assistant:/api/v1/assistant";
      set $sse "true";

      proxy_pass http://polaris-assistant:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      # Real-time SSE streaming support
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
    }
  }

  # Keycloak
  server {
    listen 443 ssl;
    server_name id.polaris.local;
    set $route "keycloak:/";
    set $sse "false";

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }
  }

  # Grafana
  server {
    listen 443 ssl;
    server_name grafana.polaris.local;
    set $route "grafana:/";
    set $sse "false";

    ssl_certificate     /etc/nginx/certs/polaris.local+1.pem;
    ssl_certificate_key /etc/nginx/certs/polaris.local+1-key.pem;

    location / {
      proxy_pass http://grafana:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      # WebSocket support for Grafana Live
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}